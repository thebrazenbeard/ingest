[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-ingest"
version = "0.1.0"
description = "Provider-neutral, provenance-bound universal intake boundary"
requires-python = ">=3.12"
license = { text = "Proprietary / source-visible; see LICENSE" }
authors = [{ name = "Patrick A. Sims" }]
dependencies = []

[project.scripts]
ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
